<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>5 BHK Penthouse</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <!-- Entrance Screen Overlay -->
  <div id="entranceScreen" class="entrance-screen">
    <div class="entrance-bg" id="entranceBg"></div>
    <div class="entrance-overlay"></div>
    <div class="entrance-top">
      <img id="entranceClientLogo" class="entrance-client-logo" src="" alt="" style="display:none;">
    </div>
    <div class="entrance-center">
      <button id="entrancePlayBtn" class="entrance-play-btn" title="Start Tour">
        <svg viewBox="0 0 24 24" fill="white" width="48" height="48"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div id="entranceSubtitle" class="entrance-subtitle">360° VIRTUAL TOUR</div>
    </div>
    <div class="entrance-bottom">
      <img id="entranceCompanyLogo" class="entrance-company-logo" src="" alt="" style="display:none;">
    </div>
  </div>

  <div class="app-shell" id="appShell" style="display:none;">
    <div id="topBar" class="top-bar">
      <div class="top-bar-left">
        <img id="clientLogo" class="client-logo" src="" alt="Logo" style="display: none;">
      </div>
      <button id="btnExplore" class="btn btn-explore">☰ Explore</button>
    </div>
    
    <aside id="tourSidebar" class="tour-sidebar hidden">
      <div class="sidebar-header">
        <div class="brand">Explore</div>
        <button id="btnCloseSidebar" class="btn-icon">×</button>
      </div>
      <div id="panoramaList" class="panorama-list"></div>
    </aside>
    
    <main class="viewer-stage">
      <div id="viewer"></div>
      <div id="loadingOverlay" class="loading-overlay">Loading panorama...</div>
      <div id="fadeOverlay" class="fade-overlay"></div>
    </main>

    <div id="mobileMinimapContainer" class="mobile-minimap-container">
      <img id="mobileMinimapImage" class="minimap-image" src="" alt="Minimap" style="display:none;" />
      <div id="mobileMinimapOverlay" class="minimap-overlay"></div>
      <div id="mobileFovCone" class="fov-cone" style="display:none;"></div>
    </div>

    <div id="bottomToolbar" class="bottom-toolbar">
       <div class="panorama-title" id="panoramaTitle">Virtual Tour</div>
       <div class="toolbar-buttons">
         <button id="btnAutoRotate" class="btn-icon" title="Toggle Auto-Rotate">
           <svg viewBox="0 0 100 65" fill="currentColor" width="24" height="24" style="vertical-align: middle;">
             <path d="M50,5 C20,5 5,16 5,30 C5,44 20,55 50,55 C53.5,55 57,54.7 60,54.1 L60,44 C57,44.7 53.6,45 50,45 C26,45 17,37 17,30 C17,23 26,15 50,15 C74,15 83,23 83,30 C83,31.7 81.5,33.5 79,35.2 L87.5,42.5 C91.5,39 95,34.5 95,30 C95,16 80,5 50,5 Z"/>
             <polygon points="60,25 60,65 85,45" />
           </svg>
         </button>
         <button id="btnFullscreen" class="btn-icon" title="Toggle Fullscreen">⛶</button>
         <button id="btnHideUI" class="btn-icon" title="Hide UI">
           <svg id="iconEye" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
           <svg id="iconEyeSlash" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none;"><path d="M11.83 9L15 12.16V12a3 3 0 0 0-3-3h-.17zm-4.3.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.3-3.8c-.5 0-1 .09-1.48.24l1.32 1.32A4.975 4.975 0 0 1 17 12c0 .48-.09.95-.24 1.41l1.62 1.62C19.79 14.1 21.1 13.16 22 12c-1.73-4.39-6-7.5-11-7.5zM2.53 4.27l1.34-1.34 16.66 16.66-1.34 1.34-2.8-2.8C14.73 19.16 13.4 19.5 12 19.5c-5 0-9.27-3.11-11-7.5 1.25-3.17 3.52-5.7 6.42-7.14L2.53 4.27z"/></svg>
         </button>
       </div>
    </div>
  </div>
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/gsap.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
